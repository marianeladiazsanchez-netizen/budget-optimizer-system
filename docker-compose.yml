services:
  # Servicio de base de datos PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: budget-optimizer-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budget-network

  # Servicio Backend
  backend:
    build: 
      context: ./budget-optimizer-backend
      dockerfile: Dockerfile
    container_name: budget-optimizer-backend-dev
    environment:
      # Configuración de Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      
      # Configuración de Base de Datos (IMPORTANTE: usar nombre del servicio 'postgres')
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-budget_optimizer}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-adminpass}
      
      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Geolocalización (nombres que Spring espera)
      GEOLOCATION_API_KEY: ${GEOLOCATION_API_KEY:-n8TCvvBOQNBWzn3R5wuMVcyXVE5zuGzD1dEpfWYaPLkvrQUZsPUjkefxlxfnC96I}
      GEOLOCATION_API_URL: ${GEOLOCATION_API_URL:-https://api.distancematrix.ai/maps/api/geocode/json}
      
      # IMPORTANTE: Spring Boot requiere estas en formato específico
      APP_GEOLOCATION_API_KEY: ${GEOLOCATION_API_KEY:-n8TCvvBOQNBWzn3R5wuMVcyXVE5zuGzD1dEpfWYaPLkvrQUZsPUjkefxlxfnC96I}
      APP_GEOLOCATION_API_URL: ${GEOLOCATION_API_URL:-https://api.distancematrix.ai/maps/api/geocode/json}
      
      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - budget-network

  # Servicio Frontend
  frontend:
    build: ./bubget-optimizer-frontend
    container_name: budget-optimizer-frontend
    volumes:
      - ./bubget-optimizer-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - ml-service
    networks:
      - budget-network

  # Servicio ML
  ml-service:
    build: ./budgte-optimizer-ml-service
    container_name: budget-optimizer-ml
    environment:
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${ML_SERVICE_PORT}:8000"
    volumes:
      - ./budgte-optimizer-ml-service:/app
    depends_on:
      - redis
    networks:
      - budget-network

  # Servicio Redis para ML Service
  redis:
    image: redis:alpine
    container_name: budget-optimizer-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - budget-network

networks:
  budget-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: